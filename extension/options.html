<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PWDog 扩展设置</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="options">
  <main class="options-card">
    <h1>PWDog 自动填充设置</h1>
    <p class="muted">
      在 PWDog 桌面端解锁后点击“扩展配对”，复制接口地址和配对令牌到下面。
    </p>

    <label class="field">
      <span>本地接口地址</span>
      <input id="apiUrl" type="text" placeholder="http://127.0.0.1:27831" autocomplete="off">
    </label>

    <label class="field">
      <span>配对令牌</span>
      <input id="token" type="password" autocomplete="off">
    </label>

    <div class="actions">
      <button id="save" type="button">保存</button>
      <button id="test" type="button" class="secondary">测试连接</button>
    </div>

    <div id="status" class="status"></div>
  </main>

  <script src="browser-api.js"></script>
  <script src="options.js"></script>
</body>
</html>
