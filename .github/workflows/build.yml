name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        shell: pwsh
        run: .\gradlew.bat :shared:jvmTest :desktopApp:test --no-daemon

      - name: Build installers
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageMsiWithCleanup :desktopApp:packagePortableZip --no-daemon

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: PWDog-windows
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/portable/*.zip
          if-no-files-found: error
